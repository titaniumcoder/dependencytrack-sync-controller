apiServer:
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  persistentVolume:
    enabled: true
    className: "dtrack-local-storage"  # Use our custom storage class
    size: "4Gi"
  service:
    type: NodePort
    nodePort: 30080
  extraEnv:
    - name: EXTRA_JAVA_OPTIONS
      value: "-Xmx4g"
    - name: SYSTEM_REQUIREMENT_CHECK_ENABLED
      value: "false"

frontend:
  service:
    type: NodePort
    nodePort: 30081
  apiBaseUrl: "http://localhost:30080"
