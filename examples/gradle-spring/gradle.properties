# DependencyTrack Configuration
# Configure these properties for your DependencyTrack instance

# Base URL of your DependencyTrack instance
dtBaseUrl=http://localhost:30080

# API Key for DependencyTrack (keep this secure!)
# You can also set this via environment variable DT_API_KEY
dtApiKey=odt_WNnyNngI_A2y4jpEysEQjhr3yUir6TEKWmsCkHQfp

# Project name in DependencyTrack (defaults to group.name)
dtProjectName=com.github.titaniumcoder.dtrack.gradle-spring

# Git Versioning Notes:
# - Version is automatically derived from Git tags with 'demo-v' prefix
# - Example: tag 'demo-v1.2.3' becomes version '1.2.3'
# - Uncommitted changes add '-dirty' suffix
# - Commits after tag add commit distance and short hash: '1.2.3-5-g1a2b3c4'
# - Fallback version '0.1.0-dev' is used if no tags exist

# Additional settings
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true