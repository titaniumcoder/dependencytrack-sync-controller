plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.2.21'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.cyclonedx.bom' version '3.0.1'
	id 'com.palantir.git-version' version '3.1.0'
	id 'com.liftric.dependency-track-companion-plugin' version '1.3.0'
}

group = 'com.github.titaniumcoder.dtrack'
version = gitVersion()
description = 'Demo project for Spring Boot'

// Git-based versioning configuration
gitVersion {
	prefix = 'demo-v'
	fallbackVersion = '0.1.0-dev'
	dirty = { it + '-dirty' }
	versionDetails { gitDetails ->
		if (gitDetails.isCleanTag) {
			return gitDetails.lastTag.replaceFirst(/^demo-v/, '')
		} else if (gitDetails.commitDistance == 0) {
			return "${gitDetails.lastTag.replaceFirst(/^demo-v/, '')}-dirty"
		} else {
			def baseVersion = gitDetails.lastTag ? gitDetails.lastTag.replaceFirst(/^demo-v/, '') : '0.1.0'
			return "${baseVersion}-${gitDetails.commitDistance}-g${gitDetails.gitHash.substring(0, 7)}"
		}
	}
}

// Show version info during build
tasks.register('showVersion') {
	group = 'versioning'
	description = 'Shows the current project version derived from Git'
	doLast {
		println "\n=== Project Version: ${project.version} ==="
		def details = versionDetails()
		println "Git: ${details.lastTag ?: 'no tags'} (${details.commitDistance} commits, ${details.branchName ?: 'unknown'})\n"
	}
}

// Automatically show version at the start of build
tasks.named('build') {
	dependsOn 'showVersion'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'tools.jackson.module:jackson-module-kotlin'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

cyclonedxBom {
	projectType = "application"
	componentVersion = project.version.toString()
}

cyclonedxDirectBom {
	projectType = "application"
	componentVersion = project.version.toString()
}

dependencyTrackCompanion {
	apiKey = project.findProperty('dtApiKey') ?: ''
	url = project.findProperty('dtBaseUrl') ?: 'http://localhost:30080'
	projectName = project.findProperty('dtProjectName') ?: "${project.group}.${project.name}"
	projectVersion = project.version
	inputFile = file("$buildDir/reports/cyclonedx-direct/bom.json")
	projectTags = [
		new com.liftric.dtcp.model.ProjectTag('dtc-auto-internal')
	]
}
